<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c6cf2"><title>Tribu</title><style>
:root{--p:#7c6cf2;--pd:#6050d5;--ink:#2f2b41;--mut:#726e82;--card:#ffffffdd;--pink:#ff99c2;--mint:#9de7cf;--bg:#fff9f4}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 8%,#ffd9e7,transparent 25%),radial-gradient(circle at 92% 10%,#d6faee,transparent 27%),linear-gradient(135deg,#fff8f2,#f7f5ff);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.auth{min-height:100vh;display:grid;place-items:center;padding:18px}.authbox{width:min(980px,100%);display:grid;grid-template-columns:1fr 1fr;background:#ffffffc8;border:1px solid #fff;border-radius:32px;overflow:hidden;box-shadow:0 18px 55px #493c821f}.side{padding:42px;background:linear-gradient(150deg,#7868ef,#a190ff);color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:570px}.brand{font-weight:950;font-size:26px;display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;background:#fff;display:grid;place-items:center}.side h1{font-size:54px;line-height:.98;letter-spacing:-2px;margin:0 0 16px}.side p{font-size:17px;line-height:1.5;color:#ffffffd8}.form{padding:42px;display:flex;flex-direction:column;justify-content:center}.form h2{font-size:32px;margin:8px 0}.mut{color:var(--mut)}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;font-weight:800}.field input,.field select{border:1px solid #ebe7f3;border-radius:15px;padding:13px 14px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary,.secondary,.danger{border:0;border-radius:15px;padding:13px 15px;font-weight:900}.primary{background:linear-gradient(135deg,var(--p),#9587ff);color:#fff}.secondary{background:#efedff;color:var(--pd)}.danger{background:#fff0f3;color:#d85671}.actions{display:grid;gap:9px;margin-top:12px}.alert{background:#fff2cd;color:#6d5413;padding:11px;border-radius:13px;margin:8px 0;font-size:13px}.shell{padding:18px 18px 84px}.layout{max-width:1450px;margin:auto;display:grid;grid-template-columns:245px 1fr;gap:16px}.navbox{background:#ffffffd8;border-radius:28px;padding:16px;box-shadow:0 12px 38px #493c8218;position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column}.navbox .brand{color:var(--ink);padding:5px 6px 18px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;border-radius:14px;padding:12px;text-align:left;font-weight:850;color:#625e70}.nav button.on{background:#eeebff;color:var(--pd)}.user{margin-top:auto;background:#f8f3ff;border-radius:17px;padding:12px;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.top h1{margin:0;font-size:29px}.hero{background:linear-gradient(130deg,#7c6cf2,#9d8eff);color:#fff;padding:24px;border-radius:26px;box-shadow:0 14px 38px #4e3f9424}.hero h2{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 10px 30px #493c8214}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}.ct{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.ct h3{margin:0}.chip{background:#f0eeff;color:var(--pd);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:850}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:9px;background:#f8f7fb;padding:10px;border-radius:13px}.item .grow{flex:1}.item small{display:block;color:var(--mut)}.inline{display:flex;gap:7px;margin-top:10px}.inline input{min-width:0;flex:1;border:1px solid #ece8f2;border-radius:13px;padding:10px}.inline button{width:42px;border:0;border-radius:13px;background:#eeebff;color:var(--pd);font-weight:950}.members,.games{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.member,.game{background:#ffffffdc;border-radius:21px;padding:17px;box-shadow:0 10px 28px #493c8213}.avatar{width:52px;height:52px;border-radius:17px;background:var(--pink);display:grid;place-items:center;color:#fff;font-weight:950;margin-bottom:8px}.game{border:0;text-align:left}.game .ico{font-size:35px}.modalbg{position:fixed;inset:0;background:#2c274c66;display:grid;place-items:center;padding:16px;z-index:10}.modal{width:min(560px,100%);background:#fff;border-radius:25px;padding:21px}.mh{display:flex;justify-content:space-between;align-items:center}.mh button{border:0;background:#f1eff6;border-radius:12px;width:38px;height:38px}.tic{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:340px;margin:18px auto}.tic button{aspect-ratio:1;border:0;border-radius:17px;background:#efedff;color:var(--pd);font-size:40px;font-weight:950}.react{height:240px;border-radius:20px;background:#ece8ff;display:grid;place-items:center;text-align:center;padding:20px;font-size:22px;font-weight:900}.react.go{background:var(--mint)}.bottom{display:none}.empty{color:var(--mut);text-align:center;padding:25px 8px}.toast{position:fixed;right:18px;bottom:18px;background:#2f2b41;color:#fff;padding:11px 14px;border-radius:13px;z-index:30}
@media(max-width:900px){.authbox{grid-template-columns:1fr}.side{min-height:230px;padding:28px}.side h1{font-size:42px}.side p{display:none}.form{padding:28px}.layout{grid-template-columns:1fr}.navbox{display:none}.s4,.s6,.s8{grid-column:span 12}.members,.games{grid-template-columns:repeat(2,1fr)}.bottom{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:fixed;bottom:10px;left:10px;right:10px;background:#ffffffed;padding:7px;border-radius:20px;box-shadow:0 12px 35px #493c8230;z-index:5}.bottom button{border:0;background:transparent;padding:8px 2px;border-radius:12px;font-size:10px;font-weight:850}.bottom button.on{background:#eeebff;color:var(--pd)}}@media(max-width:580px){.members,.games,.row{grid-template-columns:1fr}.shell{padding:12px 12px 82px}.form{padding:24px}.side{padding:24px}.top h1{font-size:24px}.hero{padding:20px}}
</style></head><body><div id="app"></div><script>
const K='tribu_mvp_1',S='tribu_session';let db=JSON.parse(localStorage.getItem(K)||'{"tribes":[],"current":null}'),view=sessionStorage.getItem(S)?'home':'login',modal=null,tic=null,react=null;const $=s=>document.querySelector(s),uid=()=>Date.now()+Math.random().toString(36).slice(2),save=()=>localStorage.setItem(K,JSON.stringify(db)),tribe=()=>db.tribes.find(x=>x.id===db.current),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ini=s=>String(s||'?').split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()).join('');async function hash(x){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function toast(m){let x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2000)}
function auth(create=false){return `<div class="auth"><div class="authbox"><section class="side"><div class="brand"><span class="logo">🏡</span>Tribu</div><div><h1>${create?'Crée ton petit monde.':'La famille, sans le bazar.'}</h1><p>${create?'Un ou deux chefs de la tribu, puis toute la famille rejoint l’aventure.':'Courses, agenda, missions et jeux : tout le monde au même endroit.'}</p></div><small>Simple • Joyeux • Privé</small></section><section class="form"><small style="color:var(--p);font-weight:900">${create?'NOUVELLE TRIBU':'BIENVENUE À LA MAISON'}</small><h2>${create?'Créer ma tribu 🥳':'Entre dans ta tribu 👋'}</h2><p class="mut">${create?'Quelques infos et c’est parti.':'Ton quartier général familial.'}</p><div id="alert"></div>${create?`<form id="create"><div class="field"><label>Nom de la tribu</label><input name="name" required placeholder="Ex. La Team Panda"></div><div class="row"><div class="field"><label>Chef de la tribu 👑</label><input name="c1" required placeholder="Prénom"></div><div class="field"><label>2e chef (optionnel)</label><input name="c2" placeholder="Prénom"></div></div><div class="field"><label>E-mail de secours</label><input type="email" name="email" required></div><div class="field"><label>Identifiant</label><input name="user" minlength="4" required></div><div class="field"><label>Mot de passe</label><input type="password" name="pass" minlength="6" required></div><div class="actions"><button class="primary">Créer notre tribu 🎉</button><button type="button" class="secondary" data-go="login">← Retour</button></div></form>`:`<form id="login"><div class="field"><label>Identifiant de la tribu</label><input name="user" required></div><div class="field"><label>Mot de passe</label><input type="password" name="pass" required></div><div class="actions"><button class="primary">Ouvrir la porte 🚪</button><button type="button" class="secondary" data-go="create">✨ Créer ma tribu</button></div></form><button id="forgot" style="border:0;background:none;color:var(--pd);font-weight:850;margin-top:10px">Mot de passe oublié ?</button>`}</section></div></div>`}
const nav=[['home','🏠','Accueil'],['tribe','👨‍👩‍👧‍👦','Ma tribu'],['agenda','📅','Agenda'],['shop','🛒','Courses'],['games','🎮','Jeux']];function app(){let t=tribe(),content=({home,tribe:vtribe,agenda,shop,games}[view]||home)();return `<div class="shell"><div class="layout"><aside class="navbox"><div class="brand"><span class="logo">🏡</span>Tribu</div><nav class="nav">${nav.map(n=>`<button data-view="${n[0]}" class="${view===n[0]?'on':''}">${n[1]} ${n[2]}</button>`).join('')}</nav><div class="user"><b>${esc(t.chiefs[0])}</b><br><span class="mut">Chef de la tribu</span></div></aside><main>${content}</main></div><nav class="bottom">${nav.map(n=>`<button data-view="${n[0]}" class="${view===n[0]?'on':''}">${n[1]}<br>${n[2]}</button>`).join('')}</nav>${modal?modalHtml():''}</div>`}function top(title,sub){return `<div class="top"><div><h1>${title}</h1><span class="mut">${sub}</span></div><button class="secondary" id="logout">🚪</button></div>`}function item(x,type){return `<label class="item"><input type="checkbox" data-toggle="${type}" data-id="${x.id}" ${x.done?'checked':''}><span class="grow">${esc(x.label)}</span></label>`}
function home(){let t=tribe(),todo=t.tasks.filter(x=>!x.done),shop=t.shop.filter(x=>!x.done);return `${top(`Coucou ${esc(t.chiefs[0])} 👋`,`Chez ${esc(t.name)}, tout est sous contrôle… presque 😄`)}<section class="hero"><h2>Tout le monde est là 💜</h2><div>${t.members.length} membre${t.members.length>1?'s':''} • ${todo.length} petite${todo.length>1?'s':''} mission${todo.length>1?'s':''}</div></section><div class="grid"><section class="card s4"><div class="ct"><h3>🛒 À acheter</h3><span class="chip">${shop.length}</span></div>${shop.length?`<div class="list">${shop.slice(0,5).map(x=>item(x,'shop')).join('')}</div>`:'<div class="empty">Liste vide ✨</div>'}<form class="inline" data-add="shop"><input name="label" required placeholder="Ajouter…"><button>+</button></form></section><section class="card s4"><div class="ct"><h3>✅ Missions</h3><span class="chip">${todo.length}</span></div>${todo.length?`<div class="list">${todo.slice(0,5).map(x=>item(x,'tasks')).join('')}</div>`:'<div class="empty">Rien à faire 😎</div>'}<form class="inline" data-add="tasks"><input name="label" required placeholder="Ex. Sortir la poubelle"><button>+</button></form></section><section class="card s4"><div class="ct"><h3>📅 Agenda</h3><span class="chip">${t.events.length}</span></div>${t.events.slice(0,4).map(e=>`<div class="item"><span>📌</span><div><b>${esc(e.title)}</b><small>${e.date}</small></div></div>`).join('')||'<div class="empty">Rien de prévu</div>'}</section><section class="card s12"><div class="ct"><h3>🎮 Pause jeu ?</h3><span class="chip">Pour tous</span></div><button class="primary" data-game="tic">Morpion</button> <button class="secondary" data-game="react">Réflexe</button></section></div>`}
function vtribe(){let t=tribe();return `${top('Ma tribu 👨‍👩‍👧‍👦','Tous les membres de la maison')}<div class="top"><h2>${esc(t.name)}</h2><button class="primary" id="addmember">+ Ajouter quelqu’un</button></div><div class="members">${t.members.map((m,i)=>`<div class="member"><div class="avatar" style="background:${['#ff99c2','#7c6cf2','#79cdb4','#f0ac75'][i%4]}">${ini(m.name)}</div><b>${esc(m.name)}</b><div class="mut">${esc(m.role)}</div></div>`).join('')}</div>`}function agenda(){let t=tribe();return `${top('Agenda familial 📅','Les rendez-vous de toute la tribu')}<div class="grid"><section class="card s4"><h3>Ajouter</h3><form id="event"><div class="field"><label>Titre</label><input name="title" required></div><div class="field"><label>Date</label><input type="date" name="date" required></div><button class="primary">Ajouter</button></form></section><section class="card s8"><h3>Prochains moments</h3><div class="list">${t.events.map(e=>`<div class="item"><span>📅</span><div class="grow"><b>${esc(e.title)}</b><small>${e.date}</small></div><button class="danger" data-delevent="${e.id}">×</button></div>`).join('')||'<div class="empty">Agenda calme</div>'}</div></section></div>`}function shop(){let t=tribe();return `${top('Courses 🛒','Ajoutez, cochez, oubliez moins')}<section class="card"><form class="inline" data-add="shop"><input name="label" required placeholder="Lait, pâtes, chocolat…"><button>+</button></form><div class="list" style="margin-top:12px">${t.shop.map(x=>`<div class="item"><input type="checkbox" data-toggle="shop" data-id="${x.id}" ${x.done?'checked':''}><span class="grow" style="${x.done?'text-decoration:line-through;opacity:.5':''}">${esc(x.label)}</span><button class="danger" data-delshop="${x.id}">×</button></div>`).join('')||'<div class="empty">Panier vide</div>'}</div></section>`}function games(){return `${top('Salle de jeux 🎮','Un peu de compétition, beaucoup de mauvaise foi')}<div class="games"><button class="game" data-game="tic"><div class="ico">❌</div><h3>Morpion</h3><p class="mut">Deux joueurs sur le même écran.</p></button><button class="game" data-game="react"><div class="ico">⚡</div><h3>Défi réflexe</h3><p class="mut">Clique dès que ça devient vert.</p></button><div class="game"><div class="ico">♟️</div><h3>Échecs</h3><p class="mut">Bientôt, avec jeu à distance.</p></div><div class="game"><div class="ico">⚫</div><h3>Dames</h3><p class="mut">Bientôt.</p></div><div class="game"><div class="ico">🏓</div><h3>Pong</h3><p class="mut">Bientôt en duel.</p></div></div>`}
function modalHtml(){if(modal==='member')return `<div class="modalbg"><div class="modal"><div class="mh"><h3>Ajouter à la tribu 💜</h3><button data-close>×</button></div><form id="member"><div class="field"><label>Prénom</label><input name="name" required></div><div class="field"><label>Rôle</label><select name="role"><option>Enfant de la tribu</option><option>Ado de la tribu</option><option>Chef de la tribu</option><option>Papy / Mamie VIP</option></select></div><button class="primary">Ajouter 🎉</button></form></div></div>`;if(modal==='tic'){if(!tic)tic={c:Array(9).fill(''),turn:'X',win:null};return `<div class="modalbg"><div class="modal"><div class="mh"><h3>❌ Morpion ⭕</h3><button data-close>×</button></div><div style="text-align:center;font-weight:900">${tic.win?tic.win==='draw'?'Match nul 😄':`Victoire de ${tic.win} 🎉`:`Au tour de ${tic.turn}`}</div><div class="tic">${tic.c.map((x,i)=>`<button data-tic="${i}" ${x||tic.win?'disabled':''}>${x}</button>`).join('')}</div><button class="secondary" id="resettic" style="width:100%">Recommencer</button></div></div>`}if(modal==='react'){if(!react)react={p:'idle',timer:null,start:0,result:null};let tx=react.p==='idle'?'Appuie pour lancer':react.p==='wait'?'Attends…':react.p==='go'?'CLIQUE ! ⚡':`${react.result} ms`;return `<div class="modalbg"><div class="modal"><div class="mh"><h3>⚡ Réflexe</h3><button data-close>×</button></div><div class="react ${react.p==='go'?'go':''}" id="reactbox">${tx}</div>${react.result?'<button class="secondary" id="resetreact" style="width:100%;margin-top:10px">Rejouer</button>':''}</div></div>`}return''}
function render(){app.innerHTML=!tribe()||!sessionStorage.getItem(S)?auth(view==='create'):app();bind()}function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{view=x.dataset.go;render()});document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>{view=x.dataset.view;render()});$('#login')?.addEventListener('submit',login);$('#create')?.addEventListener('submit',create);$('#forgot')?.addEventListener('click',()=>alertBox('La récupération par e-mail sera activée avec le serveur sécurisé.'));$('#logout')?.addEventListener('click',()=>{sessionStorage.removeItem(S);db.current=null;save();view='login';render()});$('#addmember')?.addEventListener('click',()=>{modal='member';render()});$('#member')?.addEventListener('submit',addmember);$('#event')?.addEventListener('submit',addevent);document.querySelectorAll('form[data-add]').forEach(f=>f.onsubmit=additem);document.querySelectorAll('[data-toggle]').forEach(x=>x.onchange=toggle);document.querySelectorAll('[data-delshop]').forEach(x=>x.onclick=()=>{let t=tribe();t.shop=t.shop.filter(i=>i.id!==x.dataset.delshop);save();render()});document.querySelectorAll('[data-delevent]').forEach(x=>x.onclick=()=>{let t=tribe();t.events=t.events.filter(i=>i.id!==x.dataset.delevent);save();render()});document.querySelectorAll('[data-game]').forEach(x=>x.onclick=()=>{modal=x.dataset.game;if(modal==='tic')tic=null;if(modal==='react')react=null;render()});document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>{modal=null;render()});document.querySelectorAll('[data-tic]').forEach(x=>x.onclick=()=>playtic(+x.dataset.tic));$('#resettic')?.addEventListener('click',()=>{tic=null;render()});$('#reactbox')?.addEventListener('click',playreact);$('#resetreact')?.addEventListener('click',()=>{clearTimeout(react?.timer);react=null;render()})}
function alertBox(m){$('#alert').innerHTML=`<div class="alert">${esc(m)}</div>`}async function login(e){e.preventDefault();let f=new FormData(e.target),u=f.get('user').trim().toLowerCase(),p=await hash(f.get('pass')),t=db.tribes.find(x=>x.user===u&&x.pass===p);if(!t)return alertBox('Identifiant ou mot de passe incorrect.');db.current=t.id;save();sessionStorage.setItem(S,t.id);view='home';render()}async function create(e){e.preventDefault();let f=new FormData(e.target),u=f.get('user').trim().toLowerCase();if(db.tribes.some(x=>x.user===u))return alertBox('Cet identifiant existe déjà.');let chiefs=[f.get('c1').trim(),f.get('c2').trim()].filter(Boolean),t={id:uid(),name:f.get('name').trim(),email:f.get('email').trim(),user:u,pass:await hash(f.get('pass')),chiefs,members:chiefs.map(n=>({id:uid(),name:n,role:'Chef de la tribu'})),tasks:[],shop:[],events:[]};db.tribes.push(t);db.current=t.id;save();sessionStorage.setItem(S,t.id);view='home';render();toast('Bienvenue dans votre tribu 🎉')}function addmember(e){e.preventDefault();let f=new FormData(e.target),n=f.get('name').trim(),r=f.get('role'),t=tribe();t.members.push({id:uid(),name:n,role:r});if(r==='Chef de la tribu'&&!t.chiefs.includes(n))t.chiefs.push(n);save();modal=null;render()}function addevent(e){e.preventDefault();let f=new FormData(e.target);tribe().events.push({id:uid(),title:f.get('title').trim(),date:f.get('date')});save();render()}function additem(e){e.preventDefault();let f=new FormData(e.target),k=e.target.dataset.add;tribe()[k].push({id:uid(),label:f.get('label').trim(),done:false});save();render()}function toggle(e){let k=e.target.dataset.toggle,x=tribe()[k].find(i=>i.id===e.target.dataset.id);if(x)x.done=e.target.checked;save();render()}function playtic(i){if(tic.c[i]||tic.win)return;tic.c[i]=tic.turn;let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>tic.c[a[0]]&&tic.c[a[0]]===tic.c[a[1]]&&tic.c[a[0]]===tic.c[a[2]]);tic.win=w?tic.turn:tic.c.every(Boolean)?'draw':null;if(!tic.win)tic.turn=tic.turn==='X'?'O':'X';render()}function playreact(){if(react.p==='idle'){react.p='wait';react.timer=setTimeout(()=>{react.p='go';react.start=performance.now();render()},1200+Math.random()*2200);render()}else if(react.p==='wait'){clearTimeout(react.timer);react.p='idle';toast('Trop tôt 😄');render()}else if(react.p==='go'){react.result=Math.round(performance.now()-react.start);react.p='done';render()}}render();
</script></body></html>
