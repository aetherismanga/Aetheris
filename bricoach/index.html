<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17342f"><title>Bricoach</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="./styles.css?v=8"><link rel="stylesheet" href="./mobile-fix.css?v=8"><link rel="stylesheet" href="./wizard.css?v=8"></head><body>
<div id="app"></div>
<script src="./app.js?v=8"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
if('caches' in window){caches.keys().then(keys=>keys.filter(k=>k.startsWith('bricoach-')).forEach(k=>caches.delete(k))).catch(()=>{});}
</script>
</body></html>
